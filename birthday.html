<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Apurv ❤️</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        overflow: hidden;
    }

    .card {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        animation: fadeIn 2s ease-in-out;
    }

    h1 {
        font-size: 40px;
        color: #ff4e6a;
    }

    p {
        font-size: 20px;
        color: #444;
    }

    button {
        margin-top: 20px;
        padding: 10px 20px;
        border: none;
        border-radius: 25px;
        background: #ff4e6a;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #ff1e4d;
        transform: scale(1.1);
    }

    .hidden-message {
        margin-top: 20px;
        font-size: 22px;
        color: #ff1e4d;
        display: none;
        animation: pop 1s ease-in-out;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(30px);}
        to {opacity: 1; transform: translateY(0);}
    }

    @keyframes pop {
        from {transform: scale(0);}
        to {transform: scale(1);}
    }

    .hearts {
        position: absolute;
        font-size: 20px;
        color: red;
        animation: float 5s linear infinite;
    }

    @keyframes float {
        0% {transform: translateY(0); opacity: 1;}
        100% {transform: translateY(-800px); opacity: 0;}
    }
</style>
</head>

<body>

<div class="card">
    <h1>🎉 Happy Birthday Apurv Singh 🎂</h1>
    <p>Wishing you endless happiness and success 💫</p>
    <p><strong>My Love ❤️</strong></p>
    <button onclick="showMessage()">Click for Surprise</button>
    <div class="hidden-message" id="message">
        You are the most special person in my life 💖✨
    </div>
</div>

<script>
function showMessage() {
    document.getElementById("message").style.display = "block";
    createHearts();
}

function createHearts() {
    for (let i = 0; i < 20; i++) {
        let heart = document.createElement("div");
        heart.classList.add("hearts");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 20 + 15) + "px";
        heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 5000);
    }
}
</script>

</body>
</html>
